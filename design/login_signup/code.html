<style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;

      font-weight: normal;

      font-size: 20px;

      text-transform: none;
      display: inline-block;

    }

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-start p-0 selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Mobile Viewport Container: 390px-428px pinned architectural column -->
<main class="w-full max-w-md min-h-screen bg-surface-container-lowest flex flex-col justify-between shadow-[0_1px_2px_0_rgba(0,0,0,0.04)] border-x border-outline-variant/30">
<!-- Top System Bar (iOS Status Frame) -->
<header class="w-full pt-3 px-6 pb-2 flex justify-between items-center select-none text-on-surface">
<span class="font-label-xs text-label-xs text-on-surface font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-2 text-on-surface">
<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[18px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Main Authentication Flow Container -->
<div class="px-gutter-mobile flex-1 flex flex-col justify-center py-unit-24">
<!-- Brand Anchor Header -->
<section class="flex flex-col items-center text-center mb-unit-32">
<!-- Logo Stack / Icon -->
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center text-on-primary mb-unit-12 shadow-[0_1px_2px_0_rgba(0,0,0,0.08)]">
<span class="material-symbols-outlined text-[26px]" data-icon="fitness_center">fitness_center</span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-sm text-headline-sm font-bold text-on-surface tracking-tight">
          FitStack
        </h1>
<!-- Kinetic Philosophy Tagline -->
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit-4 max-w-[260px]">
          Build habits. Track progress. Stay consistent.
        </p>
</section>
<!-- Authentication Form -->
<form class="space-y-unit-16 w-full" onsubmit="event.preventDefault();">
<!-- Email Input Component -->
<div class="space-y-unit-4">
<label class="block font-label-md text-label-md text-on-surface" for="email-field">
            Email
          </label>
<div class="relative">
<input autocomplete="email" class="w-full h-11 px-unit-12 bg-surface text-on-surface font-body-sm text-body-sm placeholder:text-outline-variant rounded-xl border border-outline-variant focus:border-primary-container focus:ring-0 focus:outline-none transition-colors duration-150" id="email-field" name="email" placeholder="alex@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input Component with Toggle -->
<div class="space-y-unit-4">
<label class="block font-label-md text-label-md text-on-surface" for="password-field">
            Password
          </label>
<div class="relative">
<input autocomplete="current-password" class="w-full h-11 pl-unit-12 pr-11 bg-surface text-on-surface font-body-sm text-body-sm placeholder:text-outline-variant rounded-xl border border-outline-variant focus:border-primary-container focus:ring-0 focus:outline-none tracking-widest transition-colors duration-150" id="password-field" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors cursor-pointer" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="password-eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA: Solid Emerald Button -->
<div class="pt-unit-4">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-md text-label-md rounded-xl active:scale-[0.98] hover:bg-primary transition-all duration-150 ease-in-out flex items-center justify-center font-semibold cursor-pointer shadow-[0_1px_2px_0_rgba(0,0,0,0.04)]" type="submit">
            Log In
          </button>
</div>
<!-- Forgot Password Link -->
<div class="text-center pt-unit-2">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors duration-150 underline-offset-4 hover:underline" href="#">
            Forgot password?
          </a>
</div>
<!-- Divider with subtle 'or' -->
<div class="relative flex items-center py-unit-8">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink mx-4 font-label-xs text-label-xs text-on-surface-variant">or</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- Secondary Social Action: Google Sign-in -->
<button class="w-full h-12 bg-surface-container-lowest text-on-surface font-label-md text-label-md rounded-xl border border-outline-variant active:bg-surface-container-low hover:bg-surface-container-low/70 transition-colors duration-150 flex items-center justify-center space-x-3 cursor-pointer shadow-[0_1px_2px_0_rgba(0,0,0,0.02)]" type="button">
<!-- Official Google 'G' Mark (Exact SVG Spec) -->
<svg aria-hidden="true" class="w-4 h-4" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.27 21.37 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.27 2.63 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="font-semibold text-on-surface">Continue with Google</span>
</button>
</form>
</div>
<!-- Sub-footer: Sign-up Context Row -->
<footer class="w-full py-unit-24 px-gutter-mobile text-center border-t border-outline-variant/30">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Don't have an account? 
        <a class="font-label-md text-label-md text-primary-container hover:text-primary font-semibold transition-colors duration-150 underline-offset-4 hover:underline ml-1" href="#">
          Sign Up
        </a>
</p>
</footer>
</main>
<!-- Interactive script for password visibility toggle -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('password-field');
      const eyeIcon = document.getElementById('password-eye-icon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          if (isPassword) {
            passwordInput.setAttribute('type', 'text');
            passwordInput.classList.remove('tracking-widest');
            eyeIcon.textContent = 'visibility_off';
            eyeIcon.setAttribute('data-icon', 'visibility_off');
          } else {
            passwordInput.setAttribute('type', 'password');
            passwordInput.classList.add('tracking-widest');
            eyeIcon.textContent = 'visibility';
            eyeIcon.setAttribute('data-icon', 'visibility');
          }
        });
      }
    });
  </script>
</body></html>
