<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FitStack - Personalized Fitness, Diet & Habit Tracker">

  <!-- PWA Theme Color -->
  <meta name="theme-color" content="#047857">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitStack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon with cache buster -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>FitStack - Fitness, Diet & Habit Tracker</title>
  <link rel="manifest" href="manifest.json?v=3">
</head>
<body>
  <script>
    window.fitStackNotifications = {
      requestPermission: async function() {
        if (!('Notification' in window)) {
          console.warn('[FitStack Notification] Web Notification API not supported.');
          return 'unsupported';
        }
        try {
          const perm = await Notification.requestPermission();
          console.log('[FitStack Notification] Permission result:', perm);
          return perm;
        } catch (e) {
          console.error('[FitStack Notification] Error requesting permission:', e);
          return 'denied';
        }
      },

      getPermissionState: function() {
        if (!('Notification' in window)) return 'unsupported';
        return Notification.permission;
      },

      showNotification: async function(title, body, tag, iconUrl) {
        if (!('Notification' in window)) return false;
        if (Notification.permission !== 'granted') return false;

        try {
          if ('serviceWorker' in navigator) {
            const registration = await navigator.serviceWorker.ready;
            if (registration && registration.showNotification) {
              await registration.showNotification(title, {
                body: body || 'Habit Reminder',
                icon: iconUrl || 'icons/Icon-192.png?v=3',
                badge: 'icons/Icon-192.png?v=3',
                tag: tag || 'fitstack_habit',
                vibrate: [200, 100, 200],
                requireInteraction: false
              });
              return true;
            }
          }
          new Notification(title, {
            body: body || 'Habit Reminder',
            icon: iconUrl || 'icons/Icon-192.png?v=3',
            tag: tag || 'fitstack_habit'
          });
          return true;
        } catch (e) {
          console.error('[FitStack Notification] Error showing notification:', e);
          return false;
        }
      },

      scheduledTimers: {},

      scheduleReminder: function(habitId, title, body, triggerTimestampMs) {
        if (this.scheduledTimers[habitId]) {
          clearTimeout(this.scheduledTimers[habitId]);
          delete this.scheduledTimers[habitId];
        }

        const now = Date.now();
        const delay = triggerTimestampMs - now;

        if (delay <= 0) {
          console.log('[FitStack Notification] Target time passed for habit:', habitId);
          return;
        }

        console.log('[FitStack Notification] Scheduled notification for "' + title + '" in ' + Math.round(delay / 1000) + 's');

        const self = this;
        this.scheduledTimers[habitId] = setTimeout(function() {
          self.showNotification('Habit Reminder: ' + title, body, habitId);
          delete self.scheduledTimers[habitId];
        }, delay);
      },

      cancelReminder: function(habitId) {
        if (this.scheduledTimers[habitId]) {
          clearTimeout(this.scheduledTimers[habitId]);
          delete this.scheduledTimers[habitId];
          console.log('[FitStack Notification] Cancelled timer for habit:', habitId);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
